name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  compatibility:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install host-test environment
        run: python -m pip install ".[test,serial]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run complete host suite
        run: python -m pytest -q

  quality:
    name: Coverage, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality environment
        run: python -m pip install ".[dev,serial]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Enforce package statement coverage
        run: >-
          python -m pytest -q
          --cov=analog_validation
          --cov=analog_validation_app
          --cov=analog_validation_pyserial
          --cov-report=term-missing
          --cov-fail-under=100
      - name: Run Ruff
        run: python -m ruff check src tools tests examples/public_adapter
      - name: Run mypy
        run: python -m mypy src tools tests examples/public_adapter

  package:
    name: Deterministic release-candidate verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release-verification environment
        run: python -m pip install ".[dev,serial]"
      - name: Build and verify a private beta candidate
        run: >-
          python tools/release_candidate_check.py
          --output "${{ runner.temp }}/release-candidate"
      - name: Audit candidate, complete history, privacy, and metadata
        run: >-
          python tools/release_audit.py
          --candidate "${{ runner.temp }}/release-candidate"
          --output "${{ runner.temp }}/release-candidate/release-audit.json"
      - name: Upload bounded verification artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-beta-release-candidate
          path: ${{ runner.temp }}/release-candidate/*
          if-no-files-found: error
          retention-days: 7
