[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-signal-afe-validation-platform"
dynamic = ["version"]
description = "Controller-neutral analog front-end validation and test automation software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
analog-validation = "analog_validation_app.cli:main"

[project.optional-dependencies]
serial = [
    "pyserial>=3.5,<4",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
]
dev = [
    "build>=1.3,<2",
    "mypy>=1.18,<3",
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["analog_validation*"]

[tool.setuptools.dynamic]
version = {attr = "analog_validation.version.__version__"}
