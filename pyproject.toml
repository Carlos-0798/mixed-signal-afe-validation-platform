[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-signal-afe-validation-platform"
version = "0.0.1"
description = "Phase 0 host tooling for an independent configurable analog front-end project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
]
dev = [
    "build>=1.3,<2",
    "mypy>=1.18,<3",
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dashboard*"]
