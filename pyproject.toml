[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-signal-afe-validation-platform"
dynamic = ["version"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Controller-neutral analog front-end validation and test automation software"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Carlos-0798"},
]
keywords = [
    "analog-front-end",
    "automated-testing",
    "data-acquisition",
    "hardware-validation",
    "mixed-signal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Carlos-0798/mixed-signal-afe-validation-platform"
Documentation = "https://github.com/Carlos-0798/mixed-signal-afe-validation-platform/tree/main/docs"
Issues = "https://github.com/Carlos-0798/mixed-signal-afe-validation-platform/issues"

[project.scripts]
analog-validation = "analog_validation_app.cli:main"

[project.optional-dependencies]
serial = [
    "pyserial>=3.5,<4",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "tomli>=2,<3; python_version < '3.11'",
]
dev = [
    "build>=1.3,<2",
    "mypy>=1.18,<3",
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["analog_validation*"]

[tool.setuptools.dynamic]
version = {attr = "analog_validation.version.__version__"}
